[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitbot"
version = "0.1.0"
description = "Local-first AI assistant for GitHub repository maintenance and coding tasks."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
authors = [{ name = "GitBot" }]
dependencies = [
    "fastapi>=0.162",
    "pydantic>=2.14",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "ruff>=0.17",
]

[project.scripts]
gitbot = "gitbot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/gitbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests that touch a real OpenCode binary or real GitHub (opt-in)",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend", "tests"]
extend-exclude = [".venv", "node_modules", "frontend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "S",    # bandit security checks
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # asserts are expected in tests
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately contain synthetic secret-shaped values, bind addresses,
# and asserts; none of it ships in the runtime package.
"tests/**" = ["S101", "S104", "S105", "S106", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["gitbot"]
